<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Attendio</title>
    <link rel="stylesheet" href="/style.css">
    <script>
        (function() {
            var path = window.location.pathname;
            // Auto-redirect clean routes or .html routes if served via 404 fallback
            if (path === '/index.html' || path === '/index') {
                window.location.replace('/' + window.location.search + window.location.hash);
            } else if (path.startsWith('/privacy')) {
                window.location.replace('/privacy' + window.location.search + window.location.hash);
            } else if (path.startsWith('/terms')) {
                window.location.replace('/terms' + window.location.search + window.location.hash);
            } else if (path.startsWith('/ravi-pal')) {
                window.location.replace('/ravi-pal' + window.location.search + window.location.hash);
            }
        })();
    </script>
    <style>
        .error-page {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d4ff, #7928ca);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: #fff;
        }
        .error-desc {
            color: #aaa;
            max-width: 460px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<header class="topbar">
    <div class="brand">
        <div class="logo">A</div>
        <div>
            <h3>Attendio</h3>
            <span class="tagline">Attendance Tracker</span>
        </div>
    </div>
    <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/privacy">Privacy Policy</a>
        <a href="/terms">Terms & Conditions</a>
    </nav>
</header>

<main class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-title">Page Not Found</h1>
    <p class="error-desc">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
    <a href="/" class="btn-primary">← Back to Homepage</a>
</main>

<footer>
    © 2025 Attendio — Developed by Azad Ali
    <div class="footer-links">
        <a href="/privacy">Privacy Policy</a>
        <span>•</span>
        <a href="/terms">Terms & Conditions</a>
    </div>
</footer>

</body>
</html>
